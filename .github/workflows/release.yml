name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-check:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Explain release policy
        run: |
          echo "This public repository publishes source code and manually verified test DMGs."
          echo "Developer ID signing/notarization is intentionally not run in public CI unless signing secrets are configured in a separate private workflow."

      - name: Verify bundled runtime exists
        run: |
          test -x HermesAgent/Resources/runtime/bin/run-hermes-dashboard.sh
          test -f HermesAgent/Resources/runtime/server/hermes_cli/web_dist/index.html

      - name: Verify source package pins
        run: xcodebuild -resolvePackageDependencies -disableAutomaticPackageResolution -project HermesAgent.xcodeproj -scheme HermesAgent
